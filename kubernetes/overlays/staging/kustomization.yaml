namespace: kijani-staging

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: kk-payments
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: kijani-registry-credentials

      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: kk-payments-config
